apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: report-generator-cache-pvc
  labels:
    app: report-generator
    component: cache
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
  storageClassName: standard
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: report-generator-export-pvc
  labels:
    app: report-generator
    component: export
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 50Gi
  storageClassName: standard
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: report-generator-logs-pvc
  labels:
    app: report-generator
    component: logs
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
  storageClassName: standard
